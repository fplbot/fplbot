name: deploy-to-prod

on:
  workflow_dispatch:

jobs:
  deploy-ubuntu-prod:
    name: deploy-to-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
    steps:
      - uses: actions/checkout@v1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: "10.0.x"
      - name: start deployment
        uses: bobheadxi/deployments@v0.4.3
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.head_ref }}
      - name: Set version
        run: |
          VERSION="$(date +%Y%m).$(date +%d).${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "INFOVERSION=$VERSION+${{ github.sha }}" >> $GITHUB_ENV
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Build docker images
        run: dotnet run --project src/Build -- docker-build
        env:
          INFOVERSION: ${{ env.INFOVERSION }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v1
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_TOKEN }}
      - name: Push docker images to Heroku
        run: dotnet run --project src/Build -- docker-push-prod
      - name: Deploy to prod
        run: dotnet run --project src/Build -- deploy-prod
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_TOKEN }}
      - name: Create Release
        id: create_release
        continue-on-error: true
        run: gh release create ${{ env.VERSION }} --generate-notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update deployment status
        uses: bobheadxi/deployments@v0.4.3
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
