name: deploy-to-prod

on:
  workflow_dispatch:

jobs:
  deploy-ubuntu-prod:
    name: deploy-to-prod
    runs-on: ubuntu-latest
    permissions:
      contents: write
      deployments: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: start deployment
        uses: bobheadxi/deployments@v1
        id: deployment
        with:
          step: start
          token: ${{ secrets.GITHUB_TOKEN }}
          env: production
          ref: ${{ github.head_ref }}
      - name: Set version
        run: |
          VERSION="$(date +%Y).$(date +%m).$(date +%d).${{ github.run_number }}"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "INFOVERSION=$VERSION+${{ github.sha }}" >> $GITHUB_ENV
      - name: Install Heroku CLI
        run: curl https://cli-assets.heroku.com/install.sh | sh
      - name: Build docker images
        run: dotnet run --project src/Build -- docker-build
        env:
          INFOVERSION: ${{ env.INFOVERSION }}
          NUGET_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@v4
        with:
          registry: registry.heroku.com
          username: _
          password: ${{ secrets.HEROKU_TOKEN }}
      - name: Push docker images to Heroku
        run: dotnet run --project src/Build -- docker-push-prod
      - name: Deploy to prod
        run: dotnet run --project src/Build -- deploy-prod
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_TOKEN }}
      - name: Get previous release tag
        id: prev_tag
        run: echo "tag=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Copilot CLI
        if: steps.prev_tag.outputs.tag != ''
        run: npm install -g @github/copilot
      - name: Generate release notes
        id: notes
        continue-on-error: true
        if: steps.prev_tag.outputs.tag != ''
        run: python3 .github/scripts/generate-release-notes.py "${{ steps.prev_tag.outputs.tag }}" "${{ github.sha }}" > release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: claude-sonnet-5
      - name: Create Release
        id: create_release
        continue-on-error: true
        run: |
          if [ ! -s release_notes.md ]; then
            echo "Ive got nozing to zay." > release_notes.md
          fi
          gh release create ${{ env.VERSION }} --title "${{ env.VERSION }}" --notes-file release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: update deployment status
        uses: bobheadxi/deployments@v1
        if: always()
        with:
          step: finish
          token: ${{ secrets.GITHUB_TOKEN }}
          status: ${{ job.status }}
          deployment_id: ${{ steps.deployment.outputs.deployment_id }}
          env: production
