name: generate-release-notes

on:
  workflow_dispatch:
    inputs:
      base-ref:
        description: "Tag/branch/SHA to compare from (defaults to the latest published release)"
        required: false
      head-ref:
        description: "Tag/branch/SHA to compare to"
        required: false
        default: "HEAD"

permissions:
  contents: read
  pull-requests: read

jobs:
  generate-release-notes:
    name: generate-release-notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Resolve base ref
        id: base
        run: |
          if [ -n "${{ inputs.base-ref }}" ]; then
            echo "ref=${{ inputs.base-ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "ref=$(gh api repos/${{ github.repository }}/releases/latest --jq .tag_name)" >> "$GITHUB_OUTPUT"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Copilot CLI
        run: npm install -g @github/copilot
      - name: Generate release notes
        id: notes
        run: python3 .github/scripts/generate-release-notes.py "${{ steps.base.outputs.ref }}" "${{ inputs.head-ref }}" > release_notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          COPILOT_MODEL: claude-sonnet-5
      - name: Show generated notes
        run: |
          {
            echo "## Generated release notes"
            echo "base-ref: ${{ steps.base.outputs.ref }}"
            echo ""
            cat release_notes.md
          } >> "$GITHUB_STEP_SUMMARY"
